<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>GameZone Console</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#12141d;
    --bg-2:#0d0f16;
    --surface:#1b1e2b;
    --surface-2:#232739;
    --border:#2e3247;
    --text:#edeef5;
    --text-dim:#9497ab;
    --text-faint:#666a82;
    --violet:#8a6bff;
    --violet-dim:#3a2f66;
    --teal:#33e2b9;
    --teal-dim:#0f3d33;
    --amber:#ffb648;
    --amber-dim:#4a3417;
    --danger:#ff6b6b;
    --danger-dim:#4a1f1f;
    --radius:14px;
    --radius-sm:9px;
    --font-head:'Space Grotesk', 'Segoe UI', sans-serif;
    --font-body:'Inter', 'Segoe UI', sans-serif;
    font-family: var(--font-body);
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html,body{height:100%;}
  body{
    background:
      radial-gradient(ellipse 900px 500px at 15% -10%, rgba(138,107,255,0.14), transparent 60%),
      radial-gradient(ellipse 700px 500px at 100% 10%, rgba(51,226,185,0.08), transparent 55%),
      var(--bg);
    color:var(--text);
    min-height:100vh;
    padding-top:env(safe-area-inset-top,0px);
    padding-bottom:env(safe-area-inset-bottom,0px);
  }
  button{font-family:inherit; cursor:pointer;}
  input{font-family:inherit;}

  /* ---- Topbar ---- */
  .topbar{
    position:sticky; top:0; z-index:20;
    display:flex; align-items:center; justify-content:space-between;
    padding:16px 24px; padding-top:calc(16px + env(safe-area-inset-top,0px));
    background:rgba(13,15,22,0.85);
    backdrop-filter:blur(10px);
    border-bottom:1px solid var(--border);
    gap:16px; flex-wrap:wrap;
  }
  .brand{display:flex; align-items:center; gap:10px; font-family:var(--font-head); font-weight:700; font-size:19px;}
  .brand svg{flex-shrink:0;}
  .brand .tagline{color:var(--text-faint); font-weight:500; font-size:13px; padding-left:8px; border-left:1px solid var(--border);}
  .tabs{display:flex; gap:4px; background:var(--surface); padding:4px; border-radius:11px; border:1px solid var(--border);}
  .tab{
    background:transparent; border:none; color:var(--text-dim);
    padding:9px 16px; border-radius:8px; font-size:14px; font-weight:600;
    transition:background .15s, color .15s;
  }
  .tab.active{background:var(--violet); color:#fff;}
  .tab:not(.active):hover{color:var(--text);}

  main{max-width:1180px; margin:0 auto; padding:28px 24px 60px;}
  .tab-panel{display:none;}
  .tab-panel.active{display:block; animation:fadein .25s ease;}
  @keyframes fadein{from{opacity:0; transform:translateY(4px);} to{opacity:1; transform:translateY(0);}}

  .panel-head{display:flex; align-items:flex-end; justify-content:space-between; gap:16px; margin-bottom:22px; flex-wrap:wrap;}
  .panel-head h1{font-family:var(--font-head); font-size:26px; font-weight:700;}
  .panel-head .sub{color:var(--text-dim); font-size:14px; margin-top:4px;}

  /* ---- Tables grid ---- */
  .tables-grid{
    display:grid;
    grid-template-columns:repeat(auto-fill, minmax(180px,1fr));
    gap:14px;
  }
  .table-card{
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:var(--radius);
    padding:18px 16px;
    text-align:left;
    display:flex; flex-direction:column; gap:14px;
    transition:border-color .15s, transform .1s;
    position:relative;
    overflow:hidden;
  }
  .table-card:hover{border-color:#3d4260; transform:translateY(-2px);}
  .table-card.running{border-color:var(--teal); box-shadow:0 0 0 1px var(--teal-dim), 0 8px 24px -12px rgba(51,226,185,0.35);}
  .table-card .t-top{display:flex; align-items:center; justify-content:space-between;}
  .table-card .t-name{font-family:var(--font-head); font-weight:700; font-size:17px;}
  .status-dot{width:9px; height:9px; border-radius:50%; background:var(--text-faint); flex-shrink:0;}
  .table-card.running .status-dot{background:var(--teal); box-shadow:0 0 8px var(--teal);}
  .t-status-label{font-size:12.5px; color:var(--text-dim); font-weight:500;}
  .table-card.running .t-status-label{color:var(--teal);}
  .t-amount{font-family:var(--font-head); font-size:22px; font-weight:700;}
  .t-items-count{font-size:12.5px; color:var(--text-faint);}
  .empty-hint{margin-top:52px;}

  .add-table-tile{
    display:flex; align-items:center; justify-content:center;
    border:1.5px dashed var(--border); border-radius:var(--radius);
    color:var(--text-faint); min-height:120px; font-size:14px; font-weight:600;
    background:transparent;
  }
  .add-table-tile:hover{color:var(--text-dim); border-color:#3d4260;}

  .empty-state{
    text-align:center; padding:60px 20px; color:var(--text-dim);
  }
  .empty-state h3{font-family:var(--font-head); color:var(--text); font-size:18px; margin-bottom:6px;}
  .empty-state p{font-size:14px; max-width:360px; margin:0 auto;}

  /* ---- buttons ---- */
  .primary-btn{
    background:var(--violet); color:#fff; border:none; border-radius:10px;
    padding:11px 18px; font-size:14px; font-weight:600;
  }
  .primary-btn:hover{background:#7a58f5;}
  .ghost-btn{
    background:transparent; border:1px solid var(--border); color:var(--text-dim);
    border-radius:10px; padding:10px 16px; font-size:13.5px; font-weight:600;
  }
  .ghost-btn:hover{color:var(--text); border-color:#3d4260;}
  .ghost-btn.small{padding:8px 14px; font-size:13px;}
  .icon-btn{
    background:var(--surface-2); border:1px solid var(--border); color:var(--text-dim);
    width:34px; height:34px; border-radius:9px; display:flex; align-items:center; justify-content:center;
    font-size:18px; line-height:1;
  }
  .icon-btn:hover{color:var(--text);}
  .icon-btn.danger:hover{color:var(--danger); border-color:var(--danger-dim);}

  /* ---- Sales tab ---- */
  .sales-controls{display:flex; gap:10px; align-items:center;}
  .sales-controls input[type=date]{
    background:var(--surface); border:1px solid var(--border); color:var(--text);
    border-radius:10px; padding:9px 12px; font-size:13.5px;
  }
  .sales-controls .ghost-btn.active-filter{border-color:var(--violet); color:var(--violet);}

  .summary-row{display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:12px; margin-bottom:22px;}
  .summary-card{
    background:var(--surface); border:1px solid var(--border); border-radius:var(--radius);
    padding:16px 18px;
  }
  .summary-card .s-label{font-size:12.5px; color:var(--text-dim); font-weight:600;}
  .summary-card .s-value{font-family:var(--font-head); font-size:24px; font-weight:700; margin-top:6px;}
  .summary-card.accent .s-value{color:var(--teal);}

  .sales-table-wrap{
    background:var(--surface); border:1px solid var(--border); border-radius:var(--radius);
    overflow-x:auto;
  }
  table.sales-table{width:100%; border-collapse:collapse; min-width:560px;}
  .sales-table th{
    text-align:left; font-size:12px; text-transform:none; font-weight:600; color:var(--text-faint);
    padding:14px 16px; border-bottom:1px solid var(--border);
  }
  .sales-table td{padding:13px 16px; font-size:14px; border-bottom:1px solid var(--border); color:var(--text-dim);}
  .sales-table tr:last-child td{border-bottom:none;}
  .sales-table td.tname{color:var(--text); font-weight:600;}
  .sales-table td.amt{color:var(--text); font-weight:700; font-family:var(--font-head);}
  .pay-badge{font-size:11.5px; font-weight:700; padding:3px 9px; border-radius:20px;}
  .pay-badge.Cash{background:var(--amber-dim); color:var(--amber);}
  .pay-badge.Online{background:var(--teal-dim); color:var(--teal);}

  /* ---- Settings ---- */
  .settings-grid{display:grid; grid-template-columns:1fr 1fr; gap:18px;}
  @media (max-width:760px){ .settings-grid{grid-template-columns:1fr;} }
  .settings-card{
    background:var(--surface); border:1px solid var(--border); border-radius:var(--radius);
    padding:20px;
  }
  .settings-card h2{font-family:var(--font-head); font-size:16px; margin-bottom:14px;}
  .settings-card form{display:flex; gap:8px; margin-bottom:16px; flex-wrap:wrap;}
  .settings-card input{
    background:var(--bg-2); border:1px solid var(--border); color:var(--text);
    border-radius:9px; padding:10px 12px; font-size:13.5px; flex:1; min-width:90px;
  }
  .settings-card input:focus{outline:none; border-color:var(--violet);}
  .settings-list{list-style:none; display:flex; flex-direction:column; gap:8px; max-height:340px; overflow-y:auto;}
  .settings-list li{
    display:flex; align-items:center; justify-content:space-between;
    background:var(--surface-2); border:1px solid var(--border); border-radius:10px;
    padding:10px 12px; font-size:13.5px;
  }
  .settings-list li .li-name{font-weight:600;}
  .settings-list li .li-price{color:var(--teal); font-weight:600; margin-right:10px; font-family:var(--font-head);}
  .settings-list .li-meta{display:flex; align-items:center;}

  /* ---- Modal ---- */
  .modal-overlay{
    position:fixed; inset:0; background:rgba(8,9,14,0.72); backdrop-filter:blur(3px);
    display:none; align-items:flex-end; justify-content:center; z-index:100;
    padding:0;
  }
  .modal-overlay.open{display:flex;}
  .modal{
    background:var(--bg); border:1px solid var(--border); width:100%; max-width:760px;
    border-radius:20px 20px 0 0; max-height:92vh; display:flex; flex-direction:column;
    padding-bottom:env(safe-area-inset-bottom,0px);
  }
  @media (min-width:820px){
    .modal-overlay{align-items:center;}
    .modal{border-radius:18px; max-height:86vh;}
  }
  .modal-head{
    display:flex; align-items:center; justify-content:space-between;
    padding:18px 20px; border-bottom:1px solid var(--border);
  }
  .modal-head h2{font-family:var(--font-head); font-size:19px;}
  .modal-body{display:flex; flex-direction:column; overflow-y:auto; flex:1;}
  @media (min-width:820px){ .modal-body{flex-direction:row;} }

  .menu-pick{padding:16px 20px; flex:1.2; border-bottom:1px solid var(--border);}
  @media (min-width:820px){ .menu-pick{border-bottom:none; border-right:1px solid var(--border); overflow-y:auto; max-height:60vh;} }
  .menu-pick h3, .order-panel h3{font-size:12.5px; text-transform:uppercase; letter-spacing:.04em; color:var(--text-faint); font-weight:700; margin-bottom:10px;}
  .menu-item-row{
    display:flex; align-items:center; justify-content:space-between;
    padding:11px 4px; border-bottom:1px solid var(--border);
  }
  .menu-item-row:last-child{border-bottom:none;}
  .menu-item-row .mi-name{font-weight:600; font-size:14px;}
  .menu-item-row .mi-price{color:var(--text-dim); font-size:12.5px; font-family:var(--font-head);}
  .add-item-btn{
    background:var(--violet-dim); color:var(--violet); border:none; width:32px; height:32px;
    border-radius:9px; font-size:18px; font-weight:700; line-height:1;
  }
  .add-item-btn:hover{background:var(--violet); color:#fff;}

  .order-panel{padding:16px 20px; flex:1; display:flex; flex-direction:column;}
  .order-list{flex:1; min-height:60px;}
  .order-empty{color:var(--text-faint); font-size:13.5px; padding:20px 0; text-align:center;}
  .order-row{display:flex; align-items:center; gap:10px; padding:9px 0; border-bottom:1px solid var(--border);}
  .order-row .or-name{flex:1; font-size:13.5px; font-weight:600;}
  .order-row .or-sub{font-size:13px; color:var(--text-dim); width:64px; text-align:right; font-family:var(--font-head);}
  .qty-stepper{display:flex; align-items:center; gap:6px;}
  .qty-stepper button{
    width:24px; height:24px; border-radius:6px; border:1px solid var(--border); background:var(--surface-2);
    color:var(--text); font-size:14px; line-height:1;
  }
  .qty-stepper span{font-size:13.5px; font-weight:600; min-width:16px; text-align:center;}

  .order-total{
    display:flex; align-items:center; justify-content:space-between;
    padding:14px 2px; margin-top:8px; border-top:1px solid var(--border);
    font-family:var(--font-head); font-size:19px; font-weight:700;
  }
  .payment-row{display:flex; gap:8px; margin:6px 0 10px;}
  .pay-btn{
    flex:1; padding:11px; border-radius:10px; border:1px solid var(--border);
    background:var(--surface-2); color:var(--text-dim); font-weight:600; font-size:13.5px;
  }
  .pay-btn.selected.cash{background:var(--amber-dim); border-color:var(--amber); color:var(--amber);}
  .pay-btn.selected.online{background:var(--teal-dim); border-color:var(--teal); color:var(--teal);}
  .settle-btn{
    background:var(--teal); color:#08211b; border:none; border-radius:10px;
    padding:13px; font-weight:700; font-size:14.5px; margin-bottom:8px;
  }
  .settle-btn:disabled{background:var(--surface-2); color:var(--text-faint); cursor:not-allowed;}
  .settle-btn:not(:disabled):hover{background:#28c9a3;}

  /* ---- toast ---- */
  .toast{
    position:fixed; bottom:24px; left:50%; transform:translateX(-50%) translateY(20px);
    background:var(--surface-2); border:1px solid var(--border); color:var(--text);
    padding:12px 20px; border-radius:11px; font-size:13.5px; font-weight:600;
    opacity:0; pointer-events:none; transition:opacity .2s, transform .2s; z-index:200;
    box-shadow:0 12px 30px -10px rgba(0,0,0,0.5);
  }
  .toast.show{opacity:1; transform:translateX(-50%) translateY(0);}

  @media (max-width:600px){
    .topbar{padding:12px 16px;}
    main{padding:20px 14px 50px;}
    .brand .tagline{display:none;}
  }
</style>
</head>
<body>

<header class="topbar">
  <div class="brand">
    <svg width="26" height="26" viewBox="0 0 24 24" fill="none">
      <rect x="2" y="7" width="20" height="11" rx="5" stroke="#8a6bff" stroke-width="1.8"/>
      <circle cx="7.5" cy="12.5" r="1.4" fill="#8a6bff"/>
      <circle cx="6" cy="14" r="0" fill="none"/>
      <path d="M6.5 12.5H8.5M7.5 11.5V13.5" stroke="#8a6bff" stroke-width="1.6" stroke-linecap="round"/>
      <circle cx="16" cy="11.5" r="1.1" fill="#33e2b9"/>
      <circle cx="18.2" cy="13.5" r="1.1" fill="#33e2b9"/>
    </svg>
    <span>GameZone</span>
    <span class="tagline">Operator Console</span>
  </div>
  <nav class="tabs">
    <button class="tab active" data-tab="tables">Tables</button>
    <button class="tab" data-tab="sales">Daily Sales</button>
    <button class="tab" data-tab="settings">Settings</button>
  </nav>
</header>

<main>
  <section id="tab-tables" class="tab-panel active">
    <div class="panel-head">
      <div>
        <h1>Tables</h1>
        <p class="sub">Tap a table to add items or settle the bill.</p>
      </div>
    </div>
    <div id="tablesGrid" class="tables-grid"></div>
  </section>

  <section id="tab-sales" class="tab-panel">
    <div class="panel-head">
      <div>
        <h1>Daily Sales</h1>
        <p class="sub">Every settled bill, most recent first.</p>
      </div>
      <div class="sales-controls">
        <input type="date" id="salesDate">
        <button id="allTimeBtn" class="ghost-btn">All time</button>
      </div>
    </div>
    <div class="summary-row" id="salesSummary"></div>
    <div class="sales-table-wrap">
      <table class="sales-table">
        <thead>
          <tr><th>Time</th><th>Table</th><th>Items</th><th>Payment</th><th>Amount</th></tr>
        </thead>
        <tbody id="salesBody"></tbody>
      </table>
    </div>
  </section>

  <section id="tab-settings" class="tab-panel">
    <div class="panel-head"><div><h1>Settings</h1><p class="sub">Manage tables and menu items.</p></div></div>
    <div class="settings-grid">
      <div class="settings-card">
        <h2>Tables</h2>
        <form id="addTableForm">
          <input type="text" id="newTableName" placeholder="e.g. PS5 - 1" required>
          <button type="submit" class="primary-btn">Add</button>
        </form>
        <ul class="settings-list" id="tablesList"></ul>
      </div>
      <div class="settings-card">
        <h2>Menu items</h2>
        <form id="addMenuForm">
          <input type="text" id="newItemName" placeholder="Item name" required>
          <input type="number" id="newItemPrice" placeholder="Price" min="0" step="1" required style="max-width:90px;">
          <button type="submit" class="primary-btn">Add</button>
        </form>
        <ul class="settings-list" id="menuList"></ul>
      </div>
    </div>
  </section>
</main>

<div id="modalOverlay" class="modal-overlay">
  <div class="modal">
    <div class="modal-head">
      <div>
        <h2 id="modalTableName">Table</h2>
        <div id="modalDuration" style="font-size:12.5px; color:var(--text-faint); margin-top:2px;"></div>
      </div>
      <button id="closeModal" class="icon-btn">&times;</button>
    </div>
    <div class="modal-body">
      <div class="menu-pick">
        <h3>Menu</h3>
        <div id="menuPick"></div>
      </div>
      <div class="order-panel">
        <h3>Current order</h3>
        <div class="order-list" id="orderList"></div>
        <div class="order-total"><span>Total</span><span id="orderTotal">₹0</span></div>
        <div class="payment-row">
          <button class="pay-btn cash" data-method="Cash">Cash</button>
          <button class="pay-btn online" data-method="Online">Online</button>
        </div>
        <button id="settleBtn" class="settle-btn" disabled>Settle bill</button>
        <button id="clearOrderBtn" class="ghost-btn small">Clear order (no payment)</button>
      </div>
    </div>
  </div>
</div>

<div id="toast" class="toast"></div>

<script>
(function(){
  "use strict";

  const STORAGE_KEY = "gz_data_v1";
  const currency = n => "₹" + Number(n).toLocaleString("en-IN");

  function loadData(){
    let raw = localStorage.getItem(STORAGE_KEY);
    if(raw){
      try{ return JSON.parse(raw); }catch(e){ /* fall through to default */ }
    }
    return {
      tables: [
        {id:"t1", name:"PS5 - 1"},
        {id:"t2", name:"PS5 - 2"},
        {id:"t3", name:"Pool Table"}
      ],
      menu: [
        {id:"m1", name:"1 Hour Slot", price:150},
        {id:"m2", name:"Cold Drink", price:40},
        {id:"m3", name:"Chips", price:30}
      ],
      orders: {},
      orderStart: {},
      sales: []
    };
  }
  let data = loadData();
  if(!data.orderStart) data.orderStart = {};
  function save(){ localStorage.setItem(STORAGE_KEY, JSON.stringify(data)); }

  function formatDuration(ms){
    const mins = Math.floor(ms / 60000);
    if(mins < 1) return "just started";
    if(mins < 60) return mins + "m";
    const hrs = Math.floor(mins / 60);
    const rem = mins % 60;
    return rem > 0 ? hrs + "h " + rem + "m" : hrs + "h";
  }
  function formatClock(ms){
    const totalSec = Math.max(0, Math.floor(ms / 1000));
    const h = Math.floor(totalSec / 3600);
    const m = Math.floor((totalSec % 3600) / 60);
    const s = totalSec % 60;
    const mm = String(m).padStart(2,"0");
    const ss = String(s).padStart(2,"0");
    return h > 0 ? `${h}:${mm}:${ss}` : `${m}:${ss}`;
  }

  function uid(prefix){ return prefix + "_" + Date.now().toString(36) + Math.random().toString(36).slice(2,7); }

  function showToast(msg){
    const t = document.getElementById("toast");
    t.textContent = msg;
    t.classList.add("show");
    clearTimeout(showToast._tm);
    showToast._tm = setTimeout(()=>t.classList.remove("show"), 2200);
  }

  // ---------- Tabs ----------
  document.querySelectorAll(".tab").forEach(btn=>{
    btn.addEventListener("click", ()=>{
      document.querySelectorAll(".tab").forEach(b=>b.classList.remove("active"));
      document.querySelectorAll(".tab-panel").forEach(p=>p.classList.remove("active"));
      btn.classList.add("active");
      document.getElementById("tab-"+btn.dataset.tab).classList.add("active");
      if(btn.dataset.tab === "sales") renderSales();
      if(btn.dataset.tab === "settings") renderSettings();
    });
  });

  // ---------- Tables rendering ----------
  function orderTotal(tableId){
    const items = data.orders[tableId] || [];
    return items.reduce((s,i)=> s + i.price * i.qty, 0);
  }
  function orderCount(tableId){
    const items = data.orders[tableId] || [];
    return items.reduce((s,i)=> s + i.qty, 0);
  }

  function renderTables(){
    const grid = document.getElementById("tablesGrid");
    grid.innerHTML = "";
    if(data.tables.length === 0){
      grid.innerHTML = `<div class="empty-state" style="grid-column:1/-1;">
        <h3>No tables yet</h3>
        <p>Add your first table from Settings to start taking orders.</p>
      </div>`;
      return;
    }
    data.tables.forEach(t=>{
      const total = orderTotal(t.id);
      const count = orderCount(t.id);
      const running = count > 0;
      const started = data.orderStart[t.id];
      const card = document.createElement("button");
      card.className = "table-card" + (running ? " running" : "");
      card.innerHTML = `
        <div class="t-top">
          <span class="t-name">${escapeHtml(t.name)}</span>
          <span class="status-dot"></span>
        </div>
        <span class="t-status-label">${running
          ? `Running · <span class="t-timer" data-start="${started||''}">${started ? formatClock(Date.now()-started) : ""}</span>`
          : "Empty"}</span>
        ${running
          ? `<div><div class="t-amount">${currency(total)}</div><div class="t-items-count">${count} item${count>1?"s":""}</div></div>`
          : `<div class="empty-hint t-items-count">Tap to open a tab</div>`}
      `;
      card.addEventListener("click", ()=> openTable(t.id));
      grid.appendChild(card);
    });
  }

  function escapeHtml(s){
    return String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
  }

  // ---------- Modal / table detail ----------
  let currentTableId = null;
  let selectedPayment = null;

  const overlay = document.getElementById("modalOverlay");
  document.getElementById("closeModal").addEventListener("click", closeModal);
  overlay.addEventListener("click", e=>{ if(e.target === overlay) closeModal(); });

  function openTable(id){
    currentTableId = id;
    selectedPayment = null;
    const t = data.tables.find(x=>x.id===id);
    if(!t) return;
    document.getElementById("modalTableName").textContent = t.name;
    renderMenuPick();
    renderOrder();
    renderModalDuration();
    document.querySelectorAll(".pay-btn").forEach(b=>b.classList.remove("selected"));
    overlay.classList.add("open");
  }
  function closeModal(){
    overlay.classList.remove("open");
    currentTableId = null;
  }

  function renderMenuPick(){
    const wrap = document.getElementById("menuPick");
    if(data.menu.length === 0){
      wrap.innerHTML = `<p style="color:var(--text-faint); font-size:13.5px;">No menu items yet. Add some from Settings.</p>`;
      return;
    }
    wrap.innerHTML = data.menu.map(m=>`
      <div class="menu-item-row">
        <div>
          <div class="mi-name">${escapeHtml(m.name)}</div>
          <div class="mi-price">${currency(m.price)}</div>
        </div>
        <button class="add-item-btn" data-item="${m.id}">+</button>
      </div>
    `).join("");
    wrap.querySelectorAll(".add-item-btn").forEach(btn=>{
      btn.addEventListener("click", ()=> addItemToOrder(btn.dataset.item));
    });
  }

  function renderModalDuration(){
    const el = document.getElementById("modalDuration");
    if(!el || !currentTableId) return;
    const started = data.orderStart[currentTableId];
    const running = orderCount(currentTableId) > 0;
    if(running && started){
      el.innerHTML = `Active for <span class="t-timer" id="modalDurationValue" data-start="${started}">${formatClock(Date.now()-started)}</span>`;
    } else {
      el.textContent = "No order started yet";
    }
  }

  function addItemToOrder(itemId){
    const menuItem = data.menu.find(m=>m.id===itemId);
    if(!menuItem || !currentTableId) return;
    if(!data.orders[currentTableId] || data.orders[currentTableId].length === 0){
      data.orders[currentTableId] = [];
      data.orderStart[currentTableId] = Date.now();
    }
    const order = data.orders[currentTableId];
    const existing = order.find(o=>o.itemId===itemId);
    if(existing) existing.qty += 1;
    else order.push({itemId, name:menuItem.name, price:menuItem.price, qty:1});
    save();
    renderOrder();
  }

  function changeQty(itemId, delta){
    const order = data.orders[currentTableId];
    if(!order) return;
    const row = order.find(o=>o.itemId===itemId);
    if(!row) return;
    row.qty += delta;
    if(row.qty <= 0) data.orders[currentTableId] = order.filter(o=>o.itemId!==itemId);
    if(data.orders[currentTableId].length === 0) delete data.orderStart[currentTableId];
    save();
    renderOrder();
    renderModalDuration();
  }

  function renderOrder(){
    const order = data.orders[currentTableId] || [];
    const listEl = document.getElementById("orderList");
    if(order.length === 0){
      listEl.innerHTML = `<div class="order-empty">No items added yet</div>`;
    } else {
      listEl.innerHTML = order.map(o=>`
        <div class="order-row">
          <span class="or-name">${escapeHtml(o.name)}</span>
          <div class="qty-stepper">
            <button data-act="minus" data-item="${o.itemId}">&minus;</button>
            <span>${o.qty}</span>
            <button data-act="plus" data-item="${o.itemId}">+</button>
          </div>
          <span class="or-sub">${currency(o.price*o.qty)}</span>
        </div>
      `).join("");
      listEl.querySelectorAll("button[data-act]").forEach(btn=>{
        btn.addEventListener("click", ()=> changeQty(btn.dataset.item, btn.dataset.act==="plus"?1:-1));
      });
    }
    const total = orderTotal(currentTableId);
    document.getElementById("orderTotal").textContent = currency(total);
    const settleBtn = document.getElementById("settleBtn");
    settleBtn.disabled = !(order.length > 0 && selectedPayment);
    renderTables(); // keep grid in sync live
  }

  document.querySelectorAll(".pay-btn").forEach(btn=>{
    btn.addEventListener("click", ()=>{
      selectedPayment = btn.dataset.method;
      document.querySelectorAll(".pay-btn").forEach(b=>b.classList.remove("selected"));
      btn.classList.add("selected");
      renderOrder();
    });
  });

  document.getElementById("settleBtn").addEventListener("click", ()=>{
    const order = data.orders[currentTableId] || [];
    if(order.length === 0 || !selectedPayment) return;
    const t = data.tables.find(x=>x.id===currentTableId);
    const total = orderTotal(currentTableId);
    data.sales.push({
      id: uid("sale"),
      tableId: currentTableId,
      tableName: t ? t.name : "Deleted table",
      items: order.map(o=>({name:o.name, price:o.price, qty:o.qty})),
      total,
      payment: selectedPayment,
      timestamp: Date.now(),
      durationMs: data.orderStart[currentTableId] ? Date.now() - data.orderStart[currentTableId] : null
    });
    delete data.orders[currentTableId];
    delete data.orderStart[currentTableId];
    save();
    showToast("Bill settled · " + currency(total) + " · " + selectedPayment);
    closeModal();
    renderTables();
  });

  document.getElementById("clearOrderBtn").addEventListener("click", ()=>{
    if(!currentTableId) return;
    if((data.orders[currentTableId]||[]).length === 0) return;
    if(!confirm("Clear this order without recording a sale?")) return;
    delete data.orders[currentTableId];
    delete data.orderStart[currentTableId];
    save();
    renderOrder();
    renderModalDuration();
  });

  // ---------- Daily sales ----------
  const salesDateInput = document.getElementById("salesDate");
  let allTime = false;

  function todayStr(){
    const d = new Date();
    return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
  }
  salesDateInput.value = todayStr();

  salesDateInput.addEventListener("change", ()=>{ allTime = false; document.getElementById("allTimeBtn").classList.remove("active-filter"); renderSales(); });
  document.getElementById("allTimeBtn").addEventListener("click", ()=>{
    allTime = !allTime;
    document.getElementById("allTimeBtn").classList.toggle("active-filter", allTime);
    renderSales();
  });

  function renderSales(){
    let sales = data.sales.slice().sort((a,b)=> b.timestamp - a.timestamp);
    if(!allTime){
      const target = salesDateInput.value || todayStr();
      sales = sales.filter(s=>{
        const d = new Date(s.timestamp);
        const str = d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
        return str === target;
      });
    }
    const total = sales.reduce((s,x)=>s+x.total,0);
    const cash = sales.filter(s=>s.payment==="Cash").reduce((s,x)=>s+x.total,0);
    const online = sales.filter(s=>s.payment==="Online").reduce((s,x)=>s+x.total,0);

    document.getElementById("salesSummary").innerHTML = `
      <div class="summary-card accent"><div class="s-label">Total sales</div><div class="s-value">${currency(total)}</div></div>
      <div class="summary-card"><div class="s-label">Cash</div><div class="s-value">${currency(cash)}</div></div>
      <div class="summary-card"><div class="s-label">Online</div><div class="s-value">${currency(online)}</div></div>
      <div class="summary-card"><div class="s-label">Transactions</div><div class="s-value">${sales.length}</div></div>
    `;

    const body = document.getElementById("salesBody");
    if(sales.length === 0){
      body.innerHTML = `<tr><td colspan="5" style="text-align:center; padding:36px; color:var(--text-faint);">No sales recorded for this period.</td></tr>`;
      return;
    }
    body.innerHTML = sales.map(s=>{
      const d = new Date(s.timestamp);
      const time = d.toLocaleTimeString("en-IN",{hour:"2-digit",minute:"2-digit"}) + (allTime ? " · " + d.toLocaleDateString("en-IN") : "");
      const itemsSummary = s.items.map(i=> i.name + (i.qty>1 ? " x"+i.qty : "")).join(", ");
      return `<tr>
        <td>${time}</td>
        <td class="tname">${escapeHtml(s.tableName)}</td>
        <td title="${escapeHtml(itemsSummary)}">${escapeHtml(itemsSummary.length>40 ? itemsSummary.slice(0,40)+"…" : itemsSummary)}</td>
        <td><span class="pay-badge ${s.payment}">${s.payment}</span></td>
        <td class="amt">${currency(s.total)}</td>
      </tr>`;
    }).join("");
  }

  // ---------- Settings: Tables ----------
  document.getElementById("addTableForm").addEventListener("submit", e=>{
    e.preventDefault();
    const input = document.getElementById("newTableName");
    const name = input.value.trim();
    if(!name) return;
    data.tables.push({id: uid("t"), name});
    save();
    input.value = "";
    renderSettings();
    renderTables();
  });

  function deleteTable(id){
    const hasOrder = (data.orders[id]||[]).length > 0;
    const msg = hasOrder
      ? "This table has a running order that hasn't been billed. Delete it anyway and lose that order?"
      : "Delete this table?";
    if(!confirm(msg)) return;
    data.tables = data.tables.filter(t=>t.id!==id);
    delete data.orders[id];
    save();
    renderSettings();
    renderTables();
  }

  function renderTablesList(){
    const ul = document.getElementById("tablesList");
    if(data.tables.length===0){
      ul.innerHTML = `<li style="justify-content:center; color:var(--text-faint);">No tables yet</li>`;
      return;
    }
    ul.innerHTML = data.tables.map(t=>`
      <li>
        <span class="li-name">${escapeHtml(t.name)}</span>
        <button class="icon-btn danger" data-del="${t.id}" title="Delete table">&times;</button>
      </li>
    `).join("");
    ul.querySelectorAll("[data-del]").forEach(btn=>{
      btn.addEventListener("click", ()=> deleteTable(btn.dataset.del));
    });
  }

  // ---------- Settings: Menu ----------
  document.getElementById("addMenuForm").addEventListener("submit", e=>{
    e.preventDefault();
    const nameInput = document.getElementById("newItemName");
    const priceInput = document.getElementById("newItemPrice");
    const name = nameInput.value.trim();
    const price = parseFloat(priceInput.value);
    if(!name || isNaN(price) || price < 0) return;
    data.menu.push({id: uid("m"), name, price});
    save();
    nameInput.value = ""; priceInput.value = "";
    renderSettings();
  });

  function deleteMenuItem(id){
    if(!confirm("Delete this menu item? It will stay on any bills already settled.")) return;
    data.menu = data.menu.filter(m=>m.id!==id);
    save();
    renderSettings();
  }

  function renderMenuList(){
    const ul = document.getElementById("menuList");
    if(data.menu.length===0){
      ul.innerHTML = `<li style="justify-content:center; color:var(--text-faint);">No menu items yet</li>`;
      return;
    }
    ul.innerHTML = data.menu.map(m=>`
      <li>
        <span class="li-name">${escapeHtml(m.name)}</span>
        <span class="li-meta">
          <span class="li-price">${currency(m.price)}</span>
          <button class="icon-btn danger" data-del="${m.id}" title="Delete item">&times;</button>
        </span>
      </li>
    `).join("");
    ul.querySelectorAll("[data-del]").forEach(btn=>{
      btn.addEventListener("click", ()=> deleteMenuItem(btn.dataset.del));
    });
  }

  function renderSettings(){
    renderTablesList();
    renderMenuList();
  }

  // ---------- Init ----------
  renderTables();
  renderSettings();

  // tick every second so running timers count up live, until each table is settled
  setInterval(()=>{
    document.querySelectorAll(".t-timer").forEach(el=>{
      const start = Number(el.dataset.start);
      if(start) el.textContent = formatClock(Date.now() - start);
    });
  }, 1000);
})();
</script>
</body>
</html>
